name: Release Chrome and Firefox extensions

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      chrome_archive: ${{ steps.package.outputs.chrome_archive }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      - name: Validate release tag and set manifest version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH, got: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          export RELEASE_VERSION="$version"
          node --input-type=module -e '
            import fs from "node:fs";
            const path = "public/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          '

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Chrome extension
        run: pnpm build:chrome

      - name: Validate Chrome extension manifest
        run: |
          pnpm validate:manifest:chrome

      - name: Validate Vietnamese normalizer assets and ONNX Runtime packaging
        run: pnpm validate:vi-assets:release

      - name: Validate third-party notices
        run: |
          set -euo pipefail
          test -s dist/chrome/THIRD_PARTY_NOTICES.txt
          grep -Fq 'OpenRAIL-M License' dist/chrome/THIRD_PARTY_NOTICES.txt
          grep -Fq 'https://huggingface.co/Supertone/supertonic-3/blob/main/LICENSE' dist/chrome/THIRD_PARTY_NOTICES.txt

      - name: Run unit tests
        run: pnpm test:unit

      - name: Evaluate Vietnamese normalization corpus
        run: pnpm evaluate:vi

      - name: Restore E2E model cache seed
        uses: actions/cache@v6
        with:
          path: .tmp/e2e-model-cache-seed
          key: e2e-model-seed-${{ hashFiles('src/shared/constants.ts') }}

      - name: Run extension E2E tests
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Package extensions
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chrome_archive="readit.dev-chrome-${RELEASE_VERSION}.zip"
          (cd dist/chrome && zip -qr "../../$chrome_archive" . -x '*.DS_Store')
          pnpm validate:release-zip "$chrome_archive"
          echo "chrome_archive=$chrome_archive" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome artifact for publishing
        uses: actions/upload-artifact@v4
        with:
          name: chrome-dist
          if-no-files-found: error
          path: |
            dist/chrome
            readit.dev-chrome-*.zip

      - name: Create GitHub Release with Chrome archive
        env:
          GH_TOKEN: ${{ github.token }}
          CHROME_ARCHIVE: ${{ steps.package.outputs.chrome_archive }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "$CHROME_ARCHIVE" --clobber
          else
            gh release create "${{ github.ref_name }}" "$CHROME_ARCHIVE" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  build-firefox:
    needs: build-and-release
    runs-on: ubuntu-latest
    outputs:
      firefox_archive: ${{ steps.package.outputs.firefox_archive }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Firefox extension
        run: pnpm build:firefox

      - name: Validate Firefox extension
        run: |
          pnpm validate:manifest:firefox
          pnpm validate:firefox

      - name: Package Firefox extension
        id: package
        env:
          RELEASE_VERSION: ${{ needs.build-and-release.outputs.version }}
        run: |
          set -euo pipefail
          firefox_archive="readit.dev-firefox-${RELEASE_VERSION}.zip"
          test -s dist/firefox/manifest.json
          test -s dist/firefox/THIRD_PARTY_NOTICES.txt
          (cd dist/firefox && zip -qr "../../$firefox_archive" . -x '*.DS_Store')
          test -s "$firefox_archive"
          echo "firefox_archive=$firefox_archive" >> "$GITHUB_OUTPUT"

      - name: Upload Firefox artifact for publishing
        uses: actions/upload-artifact@v4
        with:
          name: firefox-dist
          if-no-files-found: error
          path: |
            dist/firefox
            readit.dev-firefox-*.zip

      - name: Attach Firefox archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FIREFOX_ARCHIVE: ${{ steps.package.outputs.firefox_archive }}
        run: gh release upload "${{ github.ref_name }}" "$FIREFOX_ARCHIVE" --clobber

  publish-chrome:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: chrome-web-store
    steps:
      - name: Download extension dist artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-dist

      - name: Refresh Chrome Web Store access token
        id: cws-token
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CWS_CLIENT_ID" \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d 'grant_type=refresh_token')"
          access_token="$(jq -er '.access_token' <<< "$response")"
          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Upload package to Chrome Web Store
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.cws-token.outputs.access_token }}
          CWS_ARCHIVE: ${{ needs.build-and-release.outputs.chrome_archive }}
        run: |
          set -euo pipefail
          test -s "$CWS_ARCHIVE"
          base="https://chromewebstore.googleapis.com"
          name="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          echo "Uploading $CWS_ARCHIVE to Chrome Web Store..."
          upload_response="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            --data-binary "@$CWS_ARCHIVE" \
            "$base/upload/v2/$name:upload")"
          echo "Upload response:"
          echo "$upload_response" | jq .

      - name: Wait for Chrome Web Store upload
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.cws-token.outputs.access_token }}
        run: |
          set -euo pipefail
          base="https://chromewebstore.googleapis.com"
          name="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          max_attempts=60
          for attempt in $(seq 1 $max_attempts); do
            status="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
              "$base/v2/$name:fetchStatus")"
            # NO_ASYNC_OP: lastAsyncUploadState vắng mặt = không có async op đang pending,
            # upload đã hoàn thành synchronously.
            # Theo API discovery doc v2 (revision 20260729):
            #   UPLOAD_STATE_UNSPECIFIED = proto default, không phải lỗi
            #   NOT_FOUND = không có upload attempt nào trong 24h (upload đã xong từ trước)
            state="$(jq -r '.lastAsyncUploadState // "NO_ASYNC_OP"' <<< "$status")"
            echo "Attempt $attempt/$max_attempts — state: $state"
            case "$state" in
              SUCCEEDED|NO_ASYNC_OP|UPLOAD_STATE_UNSPECIFIED)
                echo "Upload succeeded."
                exit 0
                ;;
              NOT_FOUND)
                # Không có async upload nào trong 24h — upload đã xử lý synchronously hoặc đã xong
                echo "Upload succeeded (no recent async upload found)."
                exit 0
                ;;
              FAILED)
                echo "Upload failed:" >&2
                echo "$status" | jq . >&2
                exit 1
                ;;

              IN_PROGRESS)
                sleep 10
                ;;
              *)
                echo "Unknown state '$state', treating as in-progress. Response:" >&2
                echo "$status" | jq . >&2
                sleep 10
                ;;
            esac
          done
          echo "Timed out after $((max_attempts * 10))s waiting for Chrome Web Store upload." >&2
          echo "Last state: $state" >&2
          echo "$status" | jq . >&2
          exit 1

      - name: Submit package for publication
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.cws-token.outputs.access_token }}
        run: |
          set -euo pipefail
          base="https://chromewebstore.googleapis.com"
          name="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          publish_response="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"publishType":"DEFAULT_PUBLISH","blockOnWarnings":true}' \
            "$base/v2/$name:publish")"

          echo "Publish response:"
          echo "$publish_response" | jq .

          # Extract status codes from response
          statuses="$(jq -r '.status // [] | .[]' <<< "$publish_response" 2>/dev/null || echo "")"

          if echo "$statuses" | grep -q 'OK'; then
            echo "✅ Published successfully."
          elif echo "$statuses" | grep -q 'ITEM_PENDING_REVIEW'; then
            echo "⏳ Published but pending Chrome Web Store review (e.g. permission changes)."
            echo "The extension will go live automatically once the review is approved."
          elif echo "$statuses" | grep -q 'PUBLISHED_WITH_FRICTION_WARNING'; then
            echo "⚠️ Published with friction warnings. Check the Developer Dashboard for details."
          else
            echo "Publish status: $statuses"
            # If no explicit error status, check for error fields
            has_error="$(jq -r '.error // empty' <<< "$publish_response" 2>/dev/null || echo "")"
            if [ -n "$has_error" ]; then
              echo "❌ Publish failed:" >&2
              echo "$publish_response" | jq . >&2
              exit 1
            fi
            echo "✅ Publish request accepted."
          fi

  publish-firefox:
    needs: build-firefox
    runs-on: ubuntu-latest
    environment:
      name: addons-mozilla-org
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download extension dist artifact
        uses: actions/download-artifact@v4
        with:
          name: firefox-dist

      - name: Submit package to Firefox AMO Store
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO_JWT_ISSUER and AMO_JWT_SECRET must be configured in the addons-mozilla-org environment." >&2
            exit 1
          fi
          test -s dist/firefox/manifest.json
          echo "Submitting dist/firefox to Mozilla Add-ons Store..."
          pnpm exec web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir .tmp/web-ext-artifacts \
            --channel listed \
            --no-input \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
